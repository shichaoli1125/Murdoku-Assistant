<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f1f0f8"><title>Murdoku Local</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="assets/logo.svg"></head><body>
<main class="game-layout">
<aside class="suspect-panel"><header class="case-header"><div class="brand-row"><button class="back-button" data-action="catalog" title="Back to puzzles" aria-label="Back to puzzles">←</button><img class="logo" src="assets/logo.svg" alt="Murdoku"><span class="byline">by Manuel Garand</span><select id="language" aria-label="Language"><option value="en">English</option><option value="zh">简体中文</option></select></div><div class="case-line"><strong id="case-title"></strong><button id="timer" data-action="pause" title="Pause timer">0:00</button></div></header><div id="general-clues"></div><div id="people-scroll"><div id="people" class="people"></div></div></aside>
<section class="map-panel"><div id="board-viewport" tabindex="0" aria-label="Board: tap to note, hold to place"><div id="board-shell"><div id="column-labels" class="column-labels"></div><div id="row-labels" class="row-labels"></div><div id="board" role="grid" aria-label="Murdoku grid"></div><div id="room-labels"></div></div><div id="pause-overlay" hidden><strong>Paused</strong><button data-action="pause">▶ Continue</button></div></div><div class="map-controls"><span id="sync-dot" title="在线共享" style="font-size:13px;line-height:1">●</span><span id="coordinate">—</span><button data-action="zoom-out" title="Zoom out">−</button><button id="zoom-level" data-action="fit" title="Fit board">100%</button><button data-action="zoom-in" title="Zoom in">＋</button><button data-tool="pan" title="Pan (H)">✥</button><button data-action="fullscreen" title="Fullscreen">⛶</button><span id="target-status"></span></div><div id="board-tip" class="sr-only"></div></section>
<aside class="tool-panel"><div class="tools-top"><div id="tools-label">Tools</div><button class="stamp x-tool" data-tool="cross" title="X Mark"><img src="assets/x.svg" alt="X"></button><button class="stamp eraser-tool" data-tool="erase" title="hold to clear all squares"><span class="hold-progress"></span><img src="assets/eraser.svg" alt="Eraser"><small id="eraser-hint">hold to clear all squares</small></button><button class="stamp" data-action="undo" id="undo-button" disabled>UNDO</button><button class="stamp" data-action="redo" id="redo-button" hidden>REDO</button><button class="stamp treasure-tool" data-action="select-treasure" id="treasure-button" hidden><img src="assets/contest-person-T.svg" alt=""><span id="treasure-label">Treasure</span><small id="treasure-coordinate"></small></button><div id="extra-tools" hidden><button class="stamp" data-tool="note" title="Notes (1)">a b c</button><button class="stamp" data-tool="place" title="Place (2)">A</button><button class="stamp" data-tool="mark" title="Symbols">? ○ △</button><button class="stamp" data-tool="target" title="Treasure coordinate">⚑</button></div></div><div class="tool-spacer"></div><div class="tools-bottom"><button class="stamp hint-button" data-action="hint" id="hint-button">💡 Hint</button><button class="stamp submit-button" data-action="submit" id="submit-button" disabled><span id="submit-label">SUBMIT</span><small id="submit-hint">(place all first)</small></button><button class="stamp help-button" data-action="help" id="help-button">HOW TO PLAY</button><div class="mini-tools three"><button class="stamp" data-action="about" title="About">?</button><button class="stamp" data-action="export" title="Share">↗</button><button class="stamp" data-action="print" title="Print">▣</button></div><div class="mini-tools"><button class="stamp" data-action="sound" id="sound-button" title="Sound">🔇</button><button class="stamp" data-action="settings" title="Options">⚙</button></div></div></aside>
</main><div id="legacy-metadata" hidden><span id="file-number"></span><span id="case-kind"></span><span id="case-subtitle"></span><span id="case-description"></span><span id="grid-meta"></span><span id="people-meta"></span><span id="difficulty-meta"></span><span id="rule-summary"></span><span id="source-note"></span><span id="clue-count"></span><span id="clue-progress"></span><span id="clue-progress-bar"></span><span id="placed-count"></span><span id="save-status"></span><span id="memo-label"></span><span id="pdf-label"></span><div class="timer-wrap"></div><input id="clue-search"><div id="clues"></div></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="Close">✕</button></div><div id="dialog-body"></div><div id="dialog-actions"></div></dialog><div id="toast" role="status" aria-live="polite"></div><input id="json-file" type="file" accept=".json,application/json" hidden><input id="pdf-file" type="file" accept=".pdf,application/pdf" hidden><script src="engine.js"></script><script src="data.js"></script><script src="golf-data.js"></script><script src="contest-data.js"></script><script src="app.js"></script></body></html>
