<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Murdoku · 谋杀数独</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">

  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">MUR<span class="logo-dot">◉</span>KU</span>
      <div class="case-meta">
        <span id="caseTitle" class="case-title"></span>
        <span id="caseTitleZh" class="case-title-zh"></span>
        <span id="caseDiff" class="badge"></span>
        <select id="caseSelect" class="case-select" title="切换案件"></select>
      </div>
    </div>

    <div class="toolbar">
      <button id="btnX" class="tbtn iconbtn" title="X 标记：点格子打叉">
        <span class="x-icon"><svg viewBox="0 0 24 24"><path d="M5 5 L19 19 M19 5 L5 19"/></svg></span>
        <small>点格子打叉</small>
      </button>
      <button id="btnErase" class="tbtn iconbtn" title="橡皮擦：点格子清除该格标记/角色">
        <span class="erase-icon"><svg viewBox="0 0 24 24"><path d="M3 17 L11 9 L16 14 L9 21 H5 Z"/><path d="M11 9 L15 5 L20 10 L16 14"/></svg></span>
        <small>擦除格子</small>
      </button>
      <button id="btnTrash" class="tbtn iconbtn" title="清空全盘（可撤销）">
        <span class="trash-icon"><svg viewBox="0 0 24 24"><path d="M4 7 H20"/><path d="M9 7 V5 H15 V7"/><path d="M6 7 L7 20 H17 L18 7"/><path d="M10 10 V17 M14 10 V17"/></svg></span>
        <small>清空全盘</small>
      </button>
      <button id="btnUndo" class="tbtn" title="撤销">↶ 撤销</button>
      <button id="btnCheck" class="tbtn primary">✓ 检查</button>
      <div class="stats">
        <span class="stat"><b id="timer">00:00</b><small>用时</small></span>
        <span class="stat"><b id="progress">0 / 6</b><small>已放置</small></span>
      </div>
    </div>
  </header>

  <!-- 主体 -->
  <main class="main">

    <!-- 嫌疑人列表 -->
    <aside class="sidebar">
      <h2 class="side-title">嫌疑人 <small>SUSPECTS</small></h2>
      <div id="people" class="people"></div>
      <div id="globalClues" class="global-clues"></div>
    </aside>

    <!-- 棋盘 -->
    <section class="board-wrap">
      <h2 class="side-title">犯罪现场 <small>CRIME SCENE</small></h2>
      <div id="mapNotice" class="map-notice"></div>
      <div id="board" class="board"></div>
    </section>

  </main>
</div>

<!-- 浮动状态提示 -->
<div id="statusMsg" class="status-msg"></div>

<!-- 结案弹窗 -->
<div id="victoryModal" class="modal-mask">
  <div class="modal victory">
    <div class="case-closed">CASE CLOSED</div>
    <h3>全部位置正确！</h3>
    <p>凶手是 <b id="victoryName" class="killer-name"></b></p>
    <p class="modal-tip">他/她与受害者独处同一房间，案子破了。</p>
    <button id="btnAgain" class="tbtn primary">再来一次</button>
  </div>
</div>

<!-- 1. 案件注册表 -->
<script src="js/case-registry.js"></script>
<!-- 2. 案件：每个案件一个文件，新增案件在此加一行 -->
<script src="js/cases/car-repair.js"></script>
<script src="js/cases/the-beach.js"></script>
<script src="js/cases/the-abandoned-museum.js"></script>
<script src="js/cases/the-treasure-hunt.js"></script>
<!-- 3. 交互层 -->
<script src="js/app.js"></script>
</body>
</html>
